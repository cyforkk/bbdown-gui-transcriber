[project]
name = "bbdown-gui"
version = "0.2.0"
description = "BBDown GUI downloader with optional faster-whisper transcription"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
transcribe = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.21.1.3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[project.scripts]
bbdown-gui = "bbdown_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
